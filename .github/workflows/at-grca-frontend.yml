# AT-GRCA: arma la imagen del frontend con la apariencia de Athanor Tech.
# Las demás acciones de este repositorio vienen de intuitem y están desactivadas (ver ATHANOR.md).
# Se activa al subir una etiqueta vX.Y.Z-at.N (versión de CISO Assistant + número de ajuste de AT-GRCA).
name: AT-GRCA imagen del frontend

on:
  push:
    tags: ['v*-at.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/athanortech/at-grca-ca-frontend

jobs:
  armar:
    strategy:
      matrix:
        include:
          - plataforma: linux/amd64
            maquina: ubuntu-24.04
          - plataforma: linux/arm64
            maquina: ubuntu-24.04-arm
    runs-on: ${{ matrix.maquina }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Armar y subir (por huella, sin etiqueta)
        id: armar
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ matrix.plataforma }}
          outputs: type=image,name=${{ env.IMAGEN }},push-by-digest=true,name-canonical=true,push=true
      - name: Guardar la huella
        run: |
          mkdir -p /tmp/huellas
          d='${{ steps.armar.outputs.digest }}'
          touch "/tmp/huellas/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: huella-${{ matrix.maquina }}
          path: /tmp/huellas/*
          retention-days: 1

  publicar:
    needs: armar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/huellas
          pattern: huella-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Juntar amd64 y arm64 bajo la etiqueta
        working-directory: /tmp/huellas
        run: |
          etiqueta='${{ github.ref_type == 'tag' && github.ref_name || 'prueba' }}'
          docker buildx imagetools create -t "$IMAGEN:$etiqueta" $(printf "$IMAGEN@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGEN:$etiqueta"
